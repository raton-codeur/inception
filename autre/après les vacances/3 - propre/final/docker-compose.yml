services :
  nginx :
    build :
      context : nginx
      args :
        SSL_CONTAINER_PATH : $SSL_CONTAINER_PATH
        DOMAIN_NAME : $DOMAIN_NAME
    ports :
      - 443:443
    volumes :
      - $WORDPRESS_HOST_PATH:$WORDPRESS_CONTAINER_PATH
    depends_on :
      - wordpress
    restart : on-failure

  wordpress :
    build : wordpress
    env_file :
      - .env
      - $CREDENTIALS_HOST_PATH
    volumes :
      - $WORDPRESS_HOST_PATH:$WORDPRESS_CONTAINER_PATH
    depends_on :
      mariadb :
        condition : service_healthy
    restart : on-failure

  mariadb :
    build : mariadb
    env_file :
      - .env
      - $CREDENTIALS_HOST_PATH
    volumes :
      - $DB_HOST_PATH:$DB_CONTAINER_PATH
    restart : on-failure
    healthcheck :
      test: ["CMD", "pgrep", "mariadbd-safe"]
      interval : 1s
      retries : 20
